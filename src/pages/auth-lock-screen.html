<layout src="src/layouts/auth.html" title="Lock Screen - XivigAdmin Enterprise" active="auth-lock-screen.html">
<main class="fauth-main fauth-main-compact">
  <div class="fauth-brand-center">
    <a href="index.html" class="fauth-brand" aria-label="XivigAdmin home">
      <span class="fauth-brand-logo">
        <img src="/src/assets/img/xivig-logo.png" alt="XivigAdmin" class="brand-logo-img">
      </span>
      <span class="fauth-brand-text">
        <strong class="brand-title">Xivig<span class="brand-gradient">Admin</span></strong>
        <span class="badge-elite">PRO</span>
      </span>
    </a>
  </div>

  <div class="fauth-card fauth-card-sm">
    <div class="fauth-card-head text-center">
      <div class="fauth-avatar-wrap">
        <img src="/src/assets/img/profile-img.webp" alt="Alex Vance" class="fauth-avatar-img">
        <span class="fauth-avatar-status" title="Active session"></span>
      </div>
      <h1 class="fauth-title">Alex Vance</h1>
      <div>
        <span class="fauth-role-badge"><i class="bi bi-shield-check"></i> Enterprise Admin</span>
      </div>
      <p class="fauth-subtitle">Workspace session locked due to inactivity. Enter your master password or security PIN to continue.</p>
    </div>

    <form class="fauth-form" novalidate>
      <div class="fauth-field">
        <label for="password" class="form-label">Password / PIN</label>
        <div class="input-group">
          <div class="fauth-input-wrap">
            <i class="bi bi-lock fauth-input-icon"></i>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password or PIN" required autofocus autocomplete="current-password">
          </div>
          <button class="btn fauth-btn-toggle" type="button" data-toggle-password aria-label="Show password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn fauth-btn-primary mt-3">
        <i class="bi bi-unlock me-2"></i>
        <span>Unlock Workspace</span>
      </button>
    </form>

    <p class="fauth-foot-text">
      Not Alex Vance? <a href="auth-login.html" class="fauth-link fw-semibold">Sign in as a different user</a>
    </p>
  </div>
</main>
</layout>
