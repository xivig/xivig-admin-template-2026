<layout src="src/layouts/error.html" title="Maintenance - XivigAdmin" active="error-maintenance.html">
<div class="na-error-page na-error-maintenance">
    <div class="na-error-shell">
      <header class="na-error-head">
        <a href="index.html" class="na-error-logo"><img src="/src/assets/img/xivig-logo.svg" alt="XivigAdmin"><span>XivigAdmin</span></a>
        <span class="na-error-status">Maintenance</span>
      </header>

      <div class="na-error-layout">
        <div class="na-error-main">
          <span class="na-error-icon warning"><i class="bi bi-tools"></i></span>
          <h2 class="na-error-title">Scheduled maintenance in progress</h2>
          <p class="na-error-text">We are deploying stability improvements and security patches. Service will return shortly with all data preserved.</p>

          <div class="na-error-actions">
            <a href="contact.html" class="btn btn-primary"><i class="bi bi-headset me-1"></i> Contact Support</a>
            <a href="index.html" class="btn btn-outline-secondary"><i class="bi bi-house me-1"></i> Home</a>
          </div>
        </div>

        <aside class="na-error-side">
          <h6>Deployment Progress</h6>
          <div class="na-error-step"><i class="bi bi-check2"></i> Backup completed</div>
          <div class="na-error-step"><i class="bi bi-check2"></i> Database migration completed</div>
          <div class="na-error-step active"><i class="bi bi-arrow-repeat"></i> Services restarting</div>
          <div class="na-error-social mt-2">
            <a href="#"><i class="bi bi-twitter-x"></i></a>
            <a href="#"><i class="bi bi-facebook"></i></a>
            <a href="#"><i class="bi bi-instagram"></i></a>
          </div>
        </aside>
      </div>
    </div>
  </div>
</layout>
