<layout src="src/layouts/auth.html" title="Forgot Password - NiceAdmin" active="auth-forgot-password.html">
<div class="fauth-main-inner">
        <a href="index.html" class="fauth-logo fauth-logo-center">
          <img src="/src/assets/img/logo.webp" alt="NiceAdmin">
          <span>NiceAdmin</span>
        </a>

        <div class="fauth-card fauth-card-sm">
          <div class="fauth-card-head text-center">
            <span class="fauth-icon"><i class="bi bi-key"></i></span>
            <h1 class="fauth-title">Forgot password?</h1>
            <p class="fauth-subtitle">Enter your account email and we will send you a reset link.</p>
          </div>

          <form class="fauth-form" novalidate>
            <div class="fauth-field">
              <label for="email" class="form-label">Email address</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
          </form>

          <p class="fauth-foot-text"><a href="auth-login.html" class="fauth-link"><i class="bi bi-arrow-left"></i> Back to login</a></p>
        </div>
</layout>
