<layout src="src/layouts/auth.html" title="Forgot Password - XivigAdmin Enterprise" active="auth-forgot-password.html">
<main class="fauth-main fauth-main-compact">
  <div class="fauth-brand-center">
    <a href="index.html" class="fauth-brand" aria-label="XivigAdmin home">
      <span class="fauth-brand-logo">
        <img src="/src/assets/img/xivig-logo.png" alt="XivigAdmin" class="brand-logo-img">
      </span>
      <span class="fauth-brand-text">
        <strong class="brand-title">Xivig<span class="brand-gradient">Admin</span></strong>
        <span class="badge-elite">PRO</span>
      </span>
    </a>
  </div>

  <div class="fauth-card fauth-card-sm">
    <div class="fauth-card-head text-center">
      <div class="fauth-icon"><i class="bi bi-key"></i></div>
      <span class="fauth-kicker"><i class="bi bi-shield-check"></i> Credential Recovery</span>
      <h1 class="fauth-title">Forgot password?</h1>
      <p class="fauth-subtitle">Enter your enterprise email address and we'll send you an encrypted one-time reset link.</p>
    </div>

    <form class="fauth-form" novalidate>
      <div class="fauth-field">
        <label for="email" class="form-label">Corporate email</label>
        <div class="fauth-input-wrap">
          <i class="bi bi-envelope fauth-input-icon"></i>
          <input type="email" class="form-control" id="email" name="email" placeholder="alex.vance@xivig.com" required autocomplete="email">
        </div>
      </div>

      <div class="fauth-callout">
        <i class="bi bi-shield-lock"></i>
        <span>Reset tokens remain valid for <strong>15 minutes</strong> and will immediately invalidate earlier session credentials for security compliance.</span>
      </div>

      <button type="submit" class="btn fauth-btn-primary">
        <span>Send Recovery Link</span>
        <i class="bi bi-send ms-1"></i>
      </button>
    </form>

    <p class="fauth-foot-text">
      <a href="auth-login.html" class="fauth-link fw-semibold"><i class="bi bi-arrow-left me-1"></i> Back to sign in</a>
    </p>
  </div>
</main>
</layout>
