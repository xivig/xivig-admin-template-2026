<layout src="src/layouts/auth.html" title="Verify Email - XivigAdmin" active="auth-verify-email.html">
<div class="fauth-main-inner">
        <a href="index.html" class="fauth-logo fauth-logo-center">
          <img src="/src/assets/img/xivig-logo.svg" alt="XivigAdmin">
          <span>XivigAdmin</span>
        </a>

        <div class="fauth-card fauth-card-sm">
          <div class="fauth-card-head text-center">
            <span class="fauth-icon fauth-icon-success"><i class="bi bi-envelope-check"></i></span>
            <h1 class="fauth-title">Check your inbox</h1>
            <p class="fauth-subtitle">We've sent a verification link to <strong><a href="mailto:john@example.com">john@example.com</a></strong>.</p>
          </div>

          <form class="fauth-form" novalidate>
            <button type="submit" class="btn btn-primary w-100">Open Email App</button>
          </form>

          <p class="fauth-foot-text">Didn't receive it? <a href="#" class="fauth-link">Resend email</a></p>
          <p class="fauth-foot-text"><a href="auth-login.html" class="fauth-link"><i class="bi bi-arrow-left"></i> Back to login</a></p>
        </div>
</layout>
