<layout src="src/layouts/auth.html" title="Two-Factor Authentication - NiceAdmin" active="auth-two-factor.html">
<div class="fauth-main-inner">
        <a href="index.html" class="fauth-logo fauth-logo-center">
          <img src="/src/assets/img/logo.webp" alt="NiceAdmin">
          <span>NiceAdmin</span>
        </a>

        <div class="fauth-card fauth-card-sm">
          <div class="fauth-card-head text-center">
            <span class="fauth-icon"><i class="bi bi-shield-check"></i></span>
            <h1 class="fauth-title">Two-factor authentication</h1>
            <p class="fauth-subtitle">Enter the 6-digit verification code from your authenticator app.</p>
          </div>

          <form class="fauth-form" novalidate>
            <div class="fauth-field">
              <label class="form-label visually-hidden" for="otp-1">One-time code</label>
              <div class="fauth-otp">
                <input id="otp-1" type="text" class="form-control fauth-otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                <input type="text" class="form-control fauth-otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                <input type="text" class="form-control fauth-otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                <span class="fauth-otp-gap">-</span>
                <input type="text" class="form-control fauth-otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                <input type="text" class="form-control fauth-otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                <input type="text" class="form-control fauth-otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Verify Code</button>
          </form>

          <p class="fauth-foot-text">Can't access your app? <a href="#" class="fauth-link">Use backup code</a></p>
        </div>
</layout>
