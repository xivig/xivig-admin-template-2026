<layout src="src/layouts/error.html" title="Access Denied - XivigAdmin" active="error-403.html">
<div class="na-error-page na-error-403">
    <div class="na-error-shell">
      <header class="na-error-head">
        <a href="index.html" class="na-error-logo"><img src="/src/assets/img/xivig-logo.svg" alt="XivigAdmin"><span>XivigAdmin</span></a>
        <span class="na-error-status">Error 403</span>
      </header>

      <div class="na-error-layout">
        <div class="na-error-main">
          <span class="na-error-icon"><i class="bi bi-shield-lock"></i></span>
          <h2 class="na-error-title">Access is restricted</h2>
          <p class="na-error-text">Your account role does not include permission for this resource. Use a higher-privilege account or request access from your workspace admin.</p>

          <div class="na-error-actions">
            <a href="auth-login.html" class="btn btn-primary"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In</a>
            <a href="index.html" class="btn btn-outline-secondary"><i class="bi bi-house me-1"></i> Workspace</a>
          </div>
        </div>

        <aside class="na-error-side">
          <h6>Access Checklist</h6>
          <div class="na-error-step"><i class="bi bi-check2"></i> Confirm active workspace</div>
          <div class="na-error-step"><i class="bi bi-check2"></i> Verify your assigned role</div>
          <div class="na-error-step"><i class="bi bi-arrow-repeat"></i> Request permission update</div>
        </aside>
      </div>
    </div>
  </div>
</layout>
