<layout src="src/layouts/auth.html" title="Create Account - XivigAdmin" active="auth-register.html">
<div class="fauth-main-inner">
        <a href="index.html" class="fauth-logo fauth-logo-center">
          <img src="/src/assets/img/xivig-logo.svg" alt="XivigAdmin">
          <span>XivigAdmin</span>
        </a>

        <div class="fauth-card">
          <div class="fauth-card-head">
            <span class="fauth-kicker"><i class="bi bi-stars"></i> Get Started</span>
            <h1 class="fauth-title">Create account</h1>
            <p class="fauth-subtitle">Set up your workspace and invite your team in minutes.</p>
          </div>

          <form class="fauth-form" novalidate>
            <div class="row g-3">
              <div class="col-sm-6">
                <div class="fauth-field">
                  <label for="firstName" class="form-label">First name</label>
                  <input type="text" class="form-control" id="firstName" name="firstName" placeholder="John" required>
                </div>
              </div>
              <div class="col-sm-6">
                <div class="fauth-field">
                  <label for="lastName" class="form-label">Last name</label>
                  <input type="text" class="form-control" id="lastName" name="lastName" placeholder="Doe" required>
                </div>
              </div>
            </div>

            <div class="fauth-field">
              <label for="email" class="form-label">Email address</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
            </div>

            <div class="fauth-field">
              <label for="password" class="form-label">Password</label>
              <div class="input-group">
                <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required>
                <button class="btn btn-outline-secondary" type="button" data-toggle-password><i class="bi bi-eye"></i></button>
              </div>
              <div class="form-text">Use at least 8 characters with letters and numbers.</div>
            </div>

            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
              <label class="form-check-label" for="terms">I agree to the <a href="#" class="fauth-link">Terms</a> and <a href="#" class="fauth-link">Privacy Policy</a>.</label>
            </div>

            <button type="submit" class="btn btn-primary w-100">Create Account</button>
          </form>

          <p class="fauth-foot-text">Already have an account? <a href="auth-login.html" class="fauth-link">Sign in</a></p>
        </div>
</layout>
