<layout src="src/layouts/auth.html" title="Reset Password - XivigAdmin Enterprise" active="auth-reset-password.html">
<main class="fauth-main fauth-main-compact">
  <div class="fauth-brand-center">
    <a href="index.html" class="fauth-brand" aria-label="XivigAdmin home">
      <span class="fauth-brand-logo">
        <img src="/src/assets/img/xivig-logo.png" alt="XivigAdmin" class="brand-logo-img">
      </span>
      <span class="fauth-brand-text">
        <strong class="brand-title">Xivig<span class="brand-gradient">Admin</span></strong>
        <span class="badge-elite">PRO</span>
      </span>
    </a>
  </div>

  <div class="fauth-card fauth-card-sm">
    <div class="fauth-card-head text-center">
      <div class="fauth-icon"><i class="bi bi-shield-lock"></i></div>
      <span class="fauth-kicker"><i class="bi bi-key"></i> Credential Update</span>
      <h1 class="fauth-title">Set new password</h1>
      <p class="fauth-subtitle">Choose a robust, unique password to protect your enterprise workspace access.</p>
    </div>

    <form class="fauth-form" novalidate>
      <div class="fauth-field">
        <label for="password" class="form-label">New master password</label>
        <div class="input-group">
          <div class="fauth-input-wrap">
            <i class="bi bi-lock fauth-input-icon"></i>
            <input type="password" class="form-control" id="password" name="password" placeholder="Create strong password" required autocomplete="new-password" data-password-meter="#resetPasswordMeter" data-password-feedback="#resetPasswordFeedback">
          </div>
          <button class="btn fauth-btn-toggle" type="button" data-toggle-password aria-label="Show password">
            <i class="bi bi-eye"></i>
          </button>
        </div>

        <div class="fauth-strength-meter" id="resetPasswordMeter">
          <div class="fauth-strength-fill"></div>
        </div>
        <div class="fauth-strength-meta">
          <span>Security complexity</span>
          <span id="resetPasswordFeedback" class="fw-semibold"></span>
        </div>
      </div>

      <div class="fauth-field">
        <label for="confirmPassword" class="form-label">Confirm new password</label>
        <div class="input-group">
          <div class="fauth-input-wrap">
            <i class="bi bi-shield-check fauth-input-icon"></i>
            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Repeat new password" required autocomplete="new-password">
          </div>
          <button class="btn fauth-btn-toggle" type="button" data-toggle-password aria-label="Show password">
            <i class="bi bi-eye"></i>
          </button>
        </div>

        <ul class="fauth-rules-list">
          <li data-rule="length"><i class="bi bi-circle text-muted"></i> 8+ characters</li>
          <li data-rule="number"><i class="bi bi-circle text-muted"></i> Number (0-9)</li>
          <li data-rule="upper"><i class="bi bi-circle text-muted"></i> Upper & lowercase</li>
          <li data-rule="symbol"><i class="bi bi-circle text-muted"></i> Special symbol</li>
        </ul>
      </div>

      <button type="submit" class="btn fauth-btn-primary mt-4">
        <span>Update Password & Continue</span>
        <i class="bi bi-arrow-right ms-1"></i>
      </button>
    </form>

    <p class="fauth-foot-text">
      <a href="auth-login.html" class="fauth-link fw-semibold"><i class="bi bi-arrow-left me-1"></i> Back to sign in</a>
    </p>
  </div>
</main>
</layout>
